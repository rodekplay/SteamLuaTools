<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Генератор Manifest для SteamLuaTools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #2c2f33 0%, #23272a 100%);
            padding: 20px;
        }
        .glass-card {
            max-width: 700px;
            width: 100%;
            background: rgba(44, 47, 51, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 40px 32px;
            box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .title {
            text-align: center;
            font-weight: 600;
            font-size: 1.8rem;
            letter-spacing: -0.02em;
            color: #f0f2f5;
            margin-bottom: 8px;
        }
        .title span {
            background: linear-gradient(135deg, #b7bdc6, #d1d7e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sub-head {
            text-align: center;
            font-size: 0.95rem;
            color: #8e9297;
            margin-bottom: 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 18px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }
        .input-group label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #c4c9ce;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-group label i {
            color: #6c8cff;
            font-size: 1rem;
        }
        .input-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .input-row input {
            flex: 2;
            min-width: 180px;
            background: #2f3136;
            border: 1px solid #40444b;
            border-radius: 40px;
            padding: 14px 22px;
            font-size: 1rem;
            color: #f0f2f5;
            outline: none;
            transition: 0.2s;
            font-weight: 450;
        }
        .input-row input:focus {
            border-color: #6c8cff;
            background: #35393f;
            box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.15);
        }
        .input-row input::placeholder {
            color: #6a6f78;
            font-weight: 400;
        }
        .btn-primary {
            flex: 0 0 auto;
            background: #5865f2;
            border: none;
            border-radius: 40px;
            padding: 14px 32px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.3);
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .btn-primary:hover {
            background: #4752c4;
            transform: scale(1.02);
            box-shadow: 0 6px 16px rgba(88, 101, 242, 0.4);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: default;
            transform: none;
            box-shadow: none;
        }
        #resultsSection {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 28px;
            padding: 18px 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .terminal {
            font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.9rem;
            color: #b9bbbe;
            background: #1e1f22;
            padding: 16px 18px;
            border-radius: 20px;
            min-height: 70px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
            border-left: 3px solid #5865f2;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
        }
        .terminal .highlight {
            color: #a6c8ff;
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 6px;
            min-height: 10px;
        }
        .notfound-badge {
            background: #da373c20;
            border: 1px solid #da373c60;
            border-radius: 40px;
            padding: 8px 20px;
            color: #f6a8ab;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .hidden {
            display: none !important;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 36px;
            flex-wrap: wrap;
        }
        .footer-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 28px;
            border-radius: 60px;
            color: #d1d7e0;
            font-weight: 500;
            font-size: 1rem;
            text-decoration: none;
            transition: 0.25s;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            letter-spacing: 0.2px;
        }
        .footer-btn i {
            font-size: 1.3rem;
        }
        .footer-btn.github:hover {
            background: #2b3137;
            border-color: #8b949e;
            color: white;
            transform: translateY(-2px);
        }
        .footer-btn.discord:hover {
            background: #404eed;
            border-color: #7983f5;
            color: white;
            transform: translateY(-2px);
        }
        @media (max-width: 550px) {
            .glass-card { padding: 28px 18px; }
            .title { font-size: 1.5rem; }
            .input-row { flex-direction: column; }
            .input-row input { width: 100%; }
            .btn-primary { width: 100%; justify-content: center; }
            .footer-links { flex-direction: column; align-items: center; }
            .footer-btn { width: 100%; justify-content: center; }
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="glass-card">

    <div class="title">
        <span>Генератор «Manifest»</span>
    </div>
    <div class="sub-head">
        для SteamLuaTools
    </div>

    <div class="input-group">
        <label for="gameId"><i class="fas fa-hashtag"></i> Введите AppID игры</label>
        <div class="input-row">
            <input type="text" id="gameId" placeholder="Например, 220968" />
            <button id="checkBtn" class="btn-primary">
                <i class="fas fa-magnifying-glass"></i> Скачать
            </button>
        </div>
    </div>

    <div id="resultsSection" class="hidden">
        <div class="terminal" id="terminalOutput"></div>
        <div class="action-row">
            <div id="notFoundSection" class="hidden">
                <span class="notfound-badge"><i class="fas fa-circle-exclamation"></i> Манифест не найден</span>
            </div>
        </div>
    </div>

    <div class="footer-links">
        <a href="https://github.com/rodekplay" target="_blank" class="footer-btn github">
            <i class="fab fa-github"></i> GitHub
        </a>
        <a href="https://rodekplay.github.io/cs-news.github.io/" target="_blank" class="footer-btn discord">
            <i class="fab fa-discord"></i> Discord сервер
        </a>
    </div>

</div>

<script>
    (function() {
        "use strict";

        const gameIdInput = document.getElementById('gameId');
        const checkBtn = document.getElementById('checkBtn');
        const resultsSection = document.getElementById('resultsSection');
        const terminalOutput = document.getElementById('terminalOutput');
        const notFoundSection = document.getElementById('notFoundSection');

        let tokensData = {};
        let depotKeysData = {};

        resultsSection.classList.add('hidden');

        function resetUI() {
            notFoundSection.classList.add('hidden');
            terminalOutput.textContent = '';
            checkBtn.disabled = false;
            checkBtn.innerHTML = '<i class="fas fa-magnifying-glass"></i> Скачать';
        }

        function typeText(text, callback) {
            let index = 0;
            terminalOutput.textContent = '';
            function tick() {
                if (index < text.length) {
                    terminalOutput.textContent += text.charAt(index);
                    index++;
                    setTimeout(tick, 18);
                } else {
                    if (callback) callback();
                }
            }
            tick();
        }

        function triggerDownload(url) {
            const a = document.createElement('a');
            a.href = url;
            a.download = '';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        async function loadLocalData() {
            try {
                // Загружаем tokenstest.json
                const tokensResponse = await fetch('tokenstest.json');
                if (!tokensResponse.ok) {
                    throw new Error(`Не удалось загрузить tokenstest.json (${tokensResponse.status})`);
                }
                tokensData = await tokensResponse.json();

                // Загружаем depotkeys.json
                const depotResponse = await fetch('depotkeys.json');
                if (!depotResponse.ok) {
                    throw new Error(`Не удалось загрузить depotkeys.json (${depotResponse.status})`);
                }
                depotKeysData = await depotResponse.json();

                return true;
            } catch (error) {
                console.error('Ошибка загрузки файлов:', error);
                return false;
            }
        }

        async function checkManifest() {
            const gameId = gameIdInput.value.trim();

            if (!gameId || !/^\d+$/.test(gameId)) {
                resultsSection.classList.remove('hidden');
                notFoundSection.classList.add('hidden');
                typeText('⚠️ Ошибка: введите корректный Steam AppID (только цифры).');
                return;
            }

            checkBtn.disabled = true;
            checkBtn.innerHTML = '<span class="spinner"></span> Поиск...';

            resultsSection.classList.remove('hidden');
            notFoundSection.classList.add('hidden');

            const startMsg = `🔍 Проверка манифеста для AppID: ${gameId}\n📂 Загрузка локальных данных...\n`;
            await new Promise((resolve) => {
                typeText(startMsg, resolve);
            });

            // Загружаем локальные файлы
            const loaded = await loadLocalData();
            if (!loaded) {
                const errorMsg = `⚠️ Ошибка: не удалось загрузить файлы tokenstest.json или depotkeys.json\nУбедитесь, что они находятся в той же папке, что и HTML файл.`;
                await new Promise((resolve) => {
                    typeText(errorMsg, resolve);
                });
                checkBtn.disabled = false;
                checkBtn.innerHTML = '<i class="fas fa-magnifying-glass"></i> Скачать';
                return;
            }

            // Ищем токен для gameId
            const token = tokensData[gameId];
            if (!token) {
                const notFoundMsg = `❌ Токен для AppID ${gameId} не найден в tokenstest.json.\nПопробуйте другой ID.`;
                await new Promise((resolve) => {
                    typeText(notFoundMsg, resolve);
                });
                notFoundSection.classList.remove('hidden');
                checkBtn.disabled = false;
                checkBtn.innerHTML = '<i class="fas fa-magnifying-glass"></i> Скачать';
                return;
            }

            // Ищем ключи депотов для этого токена
            // В depotkeys.json ключи - это ID депотов, значения - хэши манифестов
            // Мы просто берем все ключи
            const depotKeys = depotKeysData;
            
            if (Object.keys(depotKeys).length === 0) {
                const errorMsg = `⚠️ Не найдены ключи депотов в depotkeys.json.`;
                await new Promise((resolve) => {
                    typeText(errorMsg, resolve);
                });
                notFoundSection.classList.remove('hidden');
                checkBtn.disabled = false;
                checkBtn.innerHTML = '<i class="fas fa-magnifying-glass"></i> Скачать';
                return;
            }

            // Формируем результаты
            const foundMsg = `✅ Данные найдены!\n📦 Токен: ${token}\n📦 Найдено ключей депотов: ${Object.keys(depotKeys).length}\n\n`;
            await new Promise((resolve) => {
                typeText(foundMsg, resolve);
            });

            // Выводим информацию о депотах
            let depotInfo = '📂 Ключи депотов:\n';
            const entries = Object.entries(depotKeys).slice(0, 10); // Показываем первые 10
            entries.forEach(([depotId, key]) => {
                depotInfo += `  ${depotId}: ${key.substring(0, 16)}...\n`;
            });
            if (Object.keys(depotKeys).length > 10) {
                depotInfo += `  ... и еще ${Object.keys(depotKeys).length - 10} ключей\n`;
            }
            
            terminalOutput.textContent += depotInfo;
            terminalOutput.textContent += `\n✔ Готово. Файлы найдены локально.`;

            checkBtn.disabled = false;
            checkBtn.innerHTML = '<i class="fas fa-magnifying-glass"></i> Скачать';
        }

        checkBtn.addEventListener('click', function(e) {
            e.preventDefault();
            resetUI();
            checkManifest();
        });

        gameIdInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                resetUI();
                checkManifest();
            }
        });

        console.log('Генератор Manifest для SteamLuaTools — локальные файлы');
    })();
</script>
</body>
</html>
