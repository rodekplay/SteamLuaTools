<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Генератор Lua скрипта для DepotDownloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #2c2f33 0%, #23272a 100%);
            padding: 20px;
        }
        .glass-card {
            max-width: 800px;
            width: 100%;
            background: rgba(44, 47, 51, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 40px 32px;
            box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .title {
            text-align: center;
            font-weight: 600;
            font-size: 1.8rem;
            letter-spacing: -0.02em;
            color: #f0f2f5;
            margin-bottom: 8px;
        }
        .title span {
            background: linear-gradient(135deg, #b7bdc6, #d1d7e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sub-head {
            text-align: center;
            font-size: 0.95rem;
            color: #8e9297;
            margin-bottom: 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 18px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }
        .input-group label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #c4c9ce;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-group label i {
            color: #6c8cff;
            font-size: 1rem;
        }
        .input-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .input-row input {
            flex: 2;
            min-width: 180px;
            background: #2f3136;
            border: 1px solid #40444b;
            border-radius: 40px;
            padding: 14px 22px;
            font-size: 1rem;
            color: #f0f2f5;
            outline: none;
            transition: 0.2s;
            font-weight: 450;
        }
        .input-row input:focus {
            border-color: #6c8cff;
            background: #35393f;
            box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.15);
        }
        .input-row input::placeholder {
            color: #6a6f78;
            font-weight: 400;
        }
        .btn-primary {
            flex: 0 0 auto;
            background: #5865f2;
            border: none;
            border-radius: 40px;
            padding: 14px 32px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.3);
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .btn-primary:hover {
            background: #4752c4;
            transform: scale(1.02);
            box-shadow: 0 6px 16px rgba(88, 101, 242, 0.4);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: default;
            transform: none;
            box-shadow: none;
        }
        #resultsSection {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 28px;
            padding: 18px 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .terminal {
            font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.85rem;
            color: #b9bbbe;
            background: #1e1f22;
            padding: 16px 18px;
            border-radius: 20px;
            min-height: 70px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
            border-left: 3px solid #5865f2;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
            max-height: 400px;
            overflow-y: auto;
        }
        .terminal .highlight {
            color: #a6c8ff;
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 12px;
            min-height: 10px;
        }
        .notfound-badge {
            background: #da373c20;
            border: 1px solid #da373c60;
            border-radius: 40px;
            padding: 8px 20px;
            color: #f6a8ab;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .hidden {
            display: none !important;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 36px;
            flex-wrap: wrap;
        }
        .footer-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 28px;
            border-radius: 60px;
            color: #d1d7e0;
            font-weight: 500;
            font-size: 1rem;
            text-decoration: none;
            transition: 0.25s;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            letter-spacing: 0.2px;
        }
        .footer-btn i {
            font-size: 1.3rem;
        }
        .footer-btn.github:hover {
            background: #2b3137;
            border-color: #8b949e;
            color: white;
            transform: translateY(-2px);
        }
        .footer-btn.discord:hover {
            background: #404eed;
            border-color: #7983f5;
            color: white;
            transform: translateY(-2px);
        }
        @media (max-width: 550px) {
            .glass-card { padding: 28px 18px; }
            .title { font-size: 1.5rem; }
            .input-row { flex-direction: column; }
            .input-row input { width: 100%; }
            .btn-primary { width: 100%; justify-content: center; }
            .footer-links { flex-direction: column; align-items: center; }
            .footer-btn { width: 100%; justify-content: center; }
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .copy-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 8px 16px;
            color: #d1d7e0;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .copy-btn.copied {
            color: #6c8cff;
            border-color: #6c8cff;
        }
    </style>
</head>
<body>

<div class="glass-card">

    <div class="title">
        <span>Генератор Lua скрипта</span>
    </div>
    <div class="sub-head">
        для DepotDownloader (локальные файлы)
    </div>

    <div class="input-group">
        <label for="gameId"><i class="fas fa-hashtag"></i> Введите AppID игры</label>
        <div class="input-row">
            <input type="text" id="gameId" placeholder="Например, 220968" />
            <button id="checkBtn" class="btn-primary">
                <i class="fas fa-code"></i> Сгенерировать
            </button>
        </div>
    </div>

    <div id="resultsSection" class="hidden">
        <div class="terminal" id="terminalOutput"></div>
        <div class="action-row">
            <button id="copyBtn" class="copy-btn hidden"><i class="fas fa-copy"></i> Копировать</button>
            <div id="notFoundSection" class="hidden">
                <span class="notfound-badge"><i class="fas fa-circle-exclamation"></i> Ключи не найдены</span>
            </div>
        </div>
    </div>

    <div class="footer-links">
        <a href="https://github.com/rodekplay" target="_blank" class="footer-btn github">
            <i class="fab fa-github"></i> GitHub
        </a>
        <a href="https://rodekplay.github.io/cs-news.github.io/" target="_blank" class="footer-btn discord">
            <i class="fab fa-discord"></i> Discord сервер
        </a>
    </div>

</div>

<script>
    (function() {
        "use strict";

        const gameIdInput = document.getElementById('gameId');
        const checkBtn = document.getElementById('checkBtn');
        const resultsSection = document.getElementById('resultsSection');
        const terminalOutput = document.getElementById('terminalOutput');
        const notFoundSection = document.getElementById('notFoundSection');
        const copyBtn = document.getElementById('copyBtn');

        let generatedScript = '';
        let tokensData = {};
        let depotKeysData = {};

        resultsSection.classList.add('hidden');
        copyBtn.classList.add('hidden');

        function resetUI() {
            notFoundSection.classList.add('hidden');
            copyBtn.classList.add('hidden');
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = '<i class="fas fa-copy"></i> Копировать';
            terminalOutput.textContent = '';
            checkBtn.disabled = false;
            checkBtn.innerHTML = '<i class="fas fa-code"></i> Сгенерировать';
        }

        function typeText(text, callback) {
            let index = 0;
            terminalOutput.textContent = '';
            function tick() {
                if (index < text.length) {
                    terminalOutput.textContent += text.charAt(index);
                    index++;
                    setTimeout(tick, 12);
                } else {
                    if (callback) callback();
                }
            }
            tick();
        }

        function generateLuaScript(appId, token, depotKeys) {
            let script = `-- DepotDownloader Lua Script\n`;
            script += `-- Generated for AppID: ${appId}\n`;
            script += `-- Token: ${token}\n\n`;
            
            script += `local appid = "${appId}"\n`;
            script += `local token = "${token}"\n\n`;
            
            script += `-- Depot keys\n`;
            script += `local depotKeys = {\n`;
            
            const keys = Object.entries(depotKeys);
            keys.forEach(([depotId, key], index) => {
                const comma = index < keys.length - 1 ? ',' : '';
                script += `    ["${depotId}"] = "${key}"${comma}\n`;
            });
            
            script += `}\n\n`;
            script += `-- Command for depotdownloader\n`;
            script += `local cmd = "depotdownloader -app " .. appid .. " -token " .. token\n`;
            script += `for depotId, key in pairs(depotKeys) do\n`;
            script += `    cmd = cmd .. " -depot " .. depotId .. " -manifest " .. key\n`;
            script += `end\n\n`;
            script += `print("Run this command:")\n`;
            script += `print(cmd)\n`;
            script += `-- Or execute it directly using os.execute(cmd)`;
            
            return script;
        }

        async function loadJSONFiles() {
            try {
                // Загружаем tokenstest.json
                const tokensResponse = await fetch('tokenstest.json');
                if (!tokensResponse.ok) {
                    throw new Error(`Не удалось загрузить tokenstest.json: ${tokensResponse.status}`);
                }
                tokensData = await tokensResponse.json();

                // Загружаем depotkeys.json
                const depotResponse = await fetch('depotkeys.json');
                if (!depotResponse.ok) {
                    throw new Error(`Не удалось загрузить depotkeys.json: ${depotResponse.status}`);
                }
                depotKeysData = await depotResponse.json();

                return true;
            } catch (error) {
                console.error('Ошибка загрузки файлов:', error);
                return false;
            }
        }

        async function generateScript() {
            const appId = gameIdInput.value.trim();

            if (!appId || !/^\d+$/.test(appId)) {
                resultsSection.classList.remove('hidden');
                notFoundSection.classList.add('hidden');
                copyBtn.classList.add('hidden');
                typeText('⚠️ Ошибка: введите корректный Steam AppID (только цифры).');
                return;
            }

            checkBtn.disabled = true;
            checkBtn.innerHTML = '<span class="spinner"></span> Загрузка...';
            resultsSection.classList.remove('hidden');
            notFoundSection.classList.add('hidden');
            copyBtn.classList.add('hidden');

            // Загружаем JSON файлы
            const loaded = await loadJSONFiles();
            if (!loaded) {
                typeText('⚠️ Ошибка: не удалось загрузить файлы tokenstest.json или depotkeys.json\nУбедитесь, что они находятся в той же папке, что и HTML файл.');
                checkBtn.disabled = false;
                checkBtn.innerHTML = '<i class="fas fa-code"></i> Сгенерировать';
                return;
            }

            const startMsg = `🔍 Поиск данных для AppID: ${appId}\n📂 Проверка локальных файлов...\n`;
            await new Promise((resolve) => {
                typeText(startMsg, resolve);
            });

            // Ищем token для appId
            const token = tokensData[appId];
            if (!token) {
                const errorMsg = `❌ Токен для AppID ${appId} не найден в tokenstest.json.\nПопробуйте другой ID.`;
                await new Promise((resolve) => {
                    typeText(errorMsg, resolve);
                });
                notFoundSection.classList.remove('hidden');
                checkBtn.disabled = false;
                checkBtn.innerHTML = '<i class="fas fa-code"></i> Сгенерировать';
                return;
            }

            // Получаем все ключи депотов
            const allDepotKeys = depotKeysData;
            
            if (Object.keys(allDepotKeys).length === 0) {
                const errorMsg = `⚠️ Не найдены ключи депотов в depotkeys.json.`;
                await new Promise((resolve) => {
                    typeText(errorMsg, resolve);
                });
                notFoundSection.classList.remove('hidden');
                checkBtn.disabled = false;
                checkBtn.innerHTML = '<i class="fas fa-code"></i> Сгенерировать';
                return;
            }

            // Генерируем скрипт
            generatedScript = generateLuaScript(appId, token, allDepotKeys);
            
            const successMsg = `✅ Данные найдены!\n📝 Генерация Lua скрипта...\n\n`;
            await new Promise((resolve) => {
                typeText(successMsg, resolve);
            });

            // Выводим готовый скрипт
            terminalOutput.textContent += generatedScript;
            copyBtn.classList.remove('hidden');
            
            checkBtn.disabled = false;
            checkBtn.innerHTML = '<i class="fas fa-code"></i> Сгенерировать';
        }

        // Копирование в буфер обмена
        copyBtn.addEventListener('click', function() {
            if (!generatedScript) return;
            navigator.clipboard.writeText(generatedScript).then(() => {
                copyBtn.innerHTML = '<i class="fas fa-check"></i> Скопировано!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fas fa-copy"></i> Копировать';
                    copyBtn.classList.remove('copied');
                }, 2000);
            }).catch(() => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = generatedScript;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                copyBtn.innerHTML = '<i class="fas fa-check"></i> Скопировано!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fas fa-copy"></i> Копировать';
                    copyBtn.classList.remove('copied');
                }, 2000);
            });
        });

        checkBtn.addEventListener('click', function(e) {
            e.preventDefault();
            resetUI();
            generateScript();
        });

        gameIdInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                resetUI();
                generateScript();
            }
        });

        console.log('Генератор Lua скрипта для DepotDownloader (локальные файлы)');
    })();
</script>
</body>
</html>
