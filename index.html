<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Steam AppID Finder & Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #1b2838;
            color: #c7d5e0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 10px;
        }
        .app-container {
            max-width: 800px;
            width: 100%;
            background: #2a3d5c;
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            border: 1px solid #4b6b8a;
            margin-top: 20px;
        }
        h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        h1 small {
            font-size: 14px;
            color: #8ba3c1;
            display: block;
            font-weight: 400;
            margin-top: 5px;
        }
        .search-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        .search-box-wrapper {
            display: flex;
            align-items: center;
            background: #1b2838;
            border-radius: 6px;
            border: 1px solid #4b6b8a;
            overflow: hidden;
            transition: border 0.2s;
        }
        .search-box-wrapper:focus-within {
            border-color: #66c0f4;
            box-shadow: 0 0 0 2px rgba(102, 192, 244, 0.3);
        }
        #searchInput {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 16px;
            font-size: 18px;
            color: #fff;
            outline: none;
            min-width: 0;
        }
        #searchInput::placeholder {
            color: #6b86a3;
            font-size: 16px;
        }
        .search-btn {
            background: #66c0f4;
            border: none;
            color: #1b2838;
            font-weight: 700;
            padding: 14px 22px;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.2s;
            white-space: nowrap;
            border-left: 1px solid #4b6b8a;
        }
        .search-btn:hover {
            background: #8cd3ff;
        }
        .search-btn:active {
            background: #4fa3d3;
        }
        #downloadBtn {
            background: #5c7e9e;
            border: 1px solid #4b6b8a;
            color: #fff;
            padding: 14px 18px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
            width: 100%;
            text-align: center;
        }
        #downloadBtn:hover {
            background: #6b8db0;
            border-color: #66c0f4;
        }
        #downloadBtn:active {
            background: #4a6b8a;
        }
        .results-area {
            background: #1b2838;
            border-radius: 8px;
            padding: 5px 0;
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #4b6b8a;
            margin-top: 5px;
        }
        .result-item {
            padding: 12px 16px;
            border-bottom: 1px solid #2a3d5c;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
            color: #c7d5e0;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-item:hover {
            background: #2f4b6e;
        }
        .result-item .app-id {
            color: #8ba3c1;
            font-size: 14px;
            font-weight: 400;
            background: #2a3d5c;
            padding: 3px 10px;
            border-radius: 20px;
            margin-left: 10px;
            white-space: nowrap;
        }
        .result-item .app-name {
            font-weight: 500;
            word-break: break-word;
            margin-right: 8px;
        }
        .status-message {
            text-align: center;
            color: #8ba3c1;
            padding: 20px 10px;
            font-size: 16px;
        }
        .status-message.error {
            color: #ff6f6f;
        }
        .status-message.success {
            color: #8bc34a;
        }
        .loading-message {
            text-align: center;
            color: #66c0f4;
            padding: 20px 10px;
            font-size: 16px;
        }
        .results-area::-webkit-scrollbar {
            width: 8px;
        }
        .results-area::-webkit-scrollbar-track {
            background: #1b2838;
        }
        .results-area::-webkit-scrollbar-thumb {
            background: #4b6b8a;
            border-radius: 4px;
        }
        .results-area::-webkit-scrollbar-thumb:hover {
            background: #66c0f4;
        }
        @media (max-width: 600px) {
            .app-container { padding: 15px 12px; }
            h1 { font-size: 22px; }
            #searchInput { font-size: 16px; padding: 12px 14px; }
            .search-btn { font-size: 16px; padding: 12px 16px; }
            #downloadBtn { font-size: 16px; padding: 12px 16px; }
            .result-item { padding: 10px 12px; flex-wrap: wrap; }
            .result-item .app-id { font-size: 12px; margin-left: 0; margin-top: 4px; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <h1>
        🎮 Steam AppID Finder
        <small>Поиск по названию игры или AppID</small>
    </h1>

    <div class="search-area">
        <div class="search-box-wrapper">
            <input type="text" id="searchInput" placeholder="Например: Team Fortress 2 или 440..." autofocus>
            <button class="search-btn" id="searchBtn">🔍 Найти</button>
        </div>
        <button id="downloadBtn">⬇️ Скачать выбранную игру</button>
    </div>

    <div class="results-area" id="resultsContainer">
        <div class="loading-message">⏳ Загрузка списка игр...</div>
    </div>
</div>

<script>
    // --- Глобальные переменные ---
    let allGames = []; // Сюда загрузим все игры из JSON
    let currentAppId = null; // ID выбранной игры

    // --- DOM элементы ---
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const resultsContainer = document.getElementById('resultsContainer');

    // --- Загрузка данных из файла steamname.json ---
    async function loadGameData() {
        try {
            const response = await fetch('steamname.json');
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            const data = await response.json();
            // Проверяем структуру — у тебя data = { applist: { apps: [...] } }
            if (data && data.applist && Array.isArray(data.applist.apps)) {
                allGames = data.applist.apps;
                showStatus(`✅ Загружено ${allGames.length} игр. Введите запрос для поиска.`);
            } else {
                throw new Error('Неверная структура файла steamname.json');
            }
        } catch (error) {
            console.error('Ошибка загрузки данных:', error);
            showStatus('❌ Не удалось загрузить список игр. Проверьте, что файл steamname.json находится рядом с index.html.', 'error');
            // Для теста, если файл не найден, можно использовать пустой массив или встроенные данные
            // allGames = []; // Раскомментировать, если нужно
        }
    }

    // --- Функция для отображения статуса ---
    function showStatus(message, type = 'info') {
        resultsContainer.innerHTML = `<div class="status-message ${type}">${message}</div>`;
    }

    // --- Основная функция поиска ---
    function performSearch() {
        const query = searchInput.value.trim().toLowerCase();

        // Если поле пустое — показываем подсказку
        if (!query) {
            showStatus('Введите название игры или AppID для поиска');
            currentAppId = null;
            return;
        }

        // Если запрос — это число, ищем по ID
        if (/^\d+$/.test(query)) {
            const id = parseInt(query, 10);
            const found = allGames.find(game => game.appid === id);
            if (found) {
                // Нашли игру по ID
                resultsContainer.innerHTML = `
                    <div class="result-item" onclick="selectGame('${found.appid}', '${found.name.replace(/'/g, "\\'")}')">
                        <span class="app-name">${found.name}</span>
                        <span class="app-id">ID: ${found.appid}</span>
                    </div>
                `;
                // Автоматически выбираем эту игру
                selectGame(found.appid, found.name);
                return;
            } else {
                showStatus(`❌ Игра с ID "${query}" не найдена.`, 'error');
                currentAppId = null;
                return;
            }
        }

        // --- Поиск по названию (по словам) ---
        const queryWords = query.split(/\s+/).filter(word => word.length > 0);

        const results = allGames.filter(game => {
            const nameLower = game.name.toLowerCase();
            // Проверяем, что каждое слово из запроса присутствует в названии
            return queryWords.every(word => nameLower.includes(word));
        });

        // Ограничиваем вывод первыми 50 результатами для производительности
        const displayResults = results.slice(0, 50);

        if (displayResults.length === 0) {
            showStatus(`❌ По запросу "${query}" ничего не найдено.`, 'error');
            currentAppId = null;
            return;
        }

        // Если только один результат — сразу его выбираем
        if (displayResults.length === 1) {
            const game = displayResults[0];
            resultsContainer.innerHTML = `
                <div class="result-item" onclick="selectGame('${game.appid}', '${game.name.replace(/'/g, "\\'")}')">
                    <span class="app-name">${game.name}</span>
                    <span class="app-id">ID: ${game.appid}</span>
                </div>
            `;
            selectGame(game.appid, game.name);
            return;
        }

        // --- Показываем все найденные результаты ---
        let html = '';
        displayResults.forEach(game => {
            // Экранируем кавычки для onclick
            const safeName = game.name.replace(/'/g, "\\'");
            html += `
                <div class="result-item" onclick="selectGame('${game.appid}', '${safeName}')">
                    <span class="app-name">${game.name}</span>
                    <span class="app-id">ID: ${game.appid}</span>
                </div>
            `;
        });

        // Добавляем информацию о количестве найденных игр
        const totalFound = results.length;
        let infoText = `Найдено: ${totalFound}`;
        if (totalFound > 50) {
            infoText += ` (показаны первые 50)`;
        }
        resultsContainer.innerHTML = `
            <div style="padding: 8px 16px; color: #8ba3c1; font-size: 14px; border-bottom: 1px solid #2a3d5c;">${infoText}</div>
            ${html}
        `;

        // Сбрасываем текущий выбранный ID, так как пользователь ещё не кликнул
        currentAppId = null;
    }

    // --- Функция выбора игры (вызывается по клику на результат) ---
    function selectGame(appid, name) {
        currentAppId = appid;
        // Вставляем ID в поле поиска
        searchInput.value = appid;
        // Подсвечиваем выбранный элемент в списке (опционально)
        const items = document.querySelectorAll('.result-item');
        items.forEach(item => {
            item.style.background = '';
        });
        // Находим и подсвечиваем выбранный элемент (если он есть в DOM)
        const selectedItem = Array.from(items).find(item => {
            return item.textContent.includes(String(appid));
        });
        if (selectedItem) {
            selectedItem.style.background = '#2f4b6e';
            selectedItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        // АВТОМАТИЧЕСКИ НАЖИМАЕМ КНОПКУ "СКАЧАТЬ"
        downloadGame();
    }

    // --- Функция скачивания игры ---
    function downloadGame() {
        if (currentAppId === null) {
            alert('❌ Сначала выберите игру из списка или введите корректный AppID.');
            return;
        }

        const appid = currentAppId;
        // Ищем название игры для информативности
        const game = allGames.find(g => g.appid === appid);
        const gameName = game ? game.name : `AppID ${appid}`;

        // Формируем ссылку для открытия в Steam
        const steamUrl = `steam://openurl/https://store.steampowered.com/app/${appid}/`;

        // Пытаемся открыть ссылку
        const result = window.open(steamUrl, '_blank');

        // Если window.open вернул null или undefined — показываем сообщение
        if (!result) {
            alert(`⚠️ Не удалось открыть ссылку. Возможно, ваш браузер блокирует всплывающие окна.\n\nПопробуйте скопировать ссылку вручную:\n${steamUrl}`);
        } else {
            // Если всё ок, показываем уведомление (не навязчиво)
            showStatus(`✅ Открываем в Steam: ${gameName} (ID: ${appid})`, 'success');
            // Через 3 секунды возвращаем обычный статус
            setTimeout(() => {
                if (searchInput.value.trim()) {
                    performSearch();
                } else {
                    showStatus('Введите запрос для поиска');
                }
            }, 3000);
        }
    }

    // --- Обработчики событий ---

    // Кнопка "Найти"
    searchBtn.addEventListener('click', performSearch);

    // Поиск при нажатии Enter
    searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            performSearch();
        }
    });

    // Кнопка "Скачать"
    downloadBtn.addEventListener('click', downloadGame);

    // Автопоиск при вводе (с задержкой для удобства)
    let searchTimeout = null;
    searchInput.addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            performSearch();
        }, 300); // задержка 300 мс
    });

    // --- Загрузка данных при старте ---
    loadGameData();

    // Делаем функцию selectGame доступной глобально для onclick в HTML
    window.selectGame = selectGame;
</script>
</body>
</html>
