<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Генератор Manifest для SteamLuaTools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #2c2f33 0%, #23272a 100%);
            padding: 20px;
        }
        .glass-card {
            max-width: 700px;
            width: 100%;
            background: rgba(44, 47, 51, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 40px 32px;
            box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .title {
            text-align: center;
            font-weight: 600;
            font-size: 1.8rem;
            letter-spacing: -0.02em;
            color: #f0f2f5;
            margin-bottom: 8px;
        }
        .title span {
            background: linear-gradient(135deg, #b7bdc6, #d1d7e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sub-head {
            text-align: center;
            font-size: 0.95rem;
            color: #8e9297;
            margin-bottom: 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 18px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }
        .input-group label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #c4c9ce;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-group label i {
            color: #6c8cff;
            font-size: 1rem;
        }
        .input-row {
            display: flex;
            gap: 12px;
            align-items: center;
            position: relative;
        }
        .search-wrapper {
            position: relative;
            flex: 1;
        }
        .search-wrapper input {
            width: 100%;
            background: #2f3136;
            border: 1px solid #40444b;
            border-radius: 40px;
            padding: 14px 22px;
            font-size: 1rem;
            color: #f0f2f5;
            outline: none;
            transition: 0.2s;
            font-weight: 450;
        }
        .search-wrapper input:focus {
            border-color: #6c8cff;
            background: #35393f;
            box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.15);
        }
        .search-wrapper input::placeholder {
            color: #6a6f78;
            font-weight: 400;
        }
        .btn-primary {
            flex: 0 0 auto;
            background: #5865f2;
            border: none;
            border-radius: 40px;
            padding: 14px 32px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.3);
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .btn-primary:hover {
            background: #4752c4;
            transform: scale(1.02);
            box-shadow: 0 6px 16px rgba(88, 101, 242, 0.4);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: default;
            transform: none;
            box-shadow: none;
        }
        #resultsSection {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 28px;
            padding: 18px 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .terminal {
            font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.9rem;
            color: #b9bbbe;
            background: #1e1f22;
            padding: 16px 18px;
            border-radius: 20px;
            min-height: 70px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
            border-left: 3px solid #5865f2;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
        }
        .terminal .highlight {
            color: #a6c8ff;
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 6px;
            min-height: 10px;
        }
        .notfound-badge {
            background: #da373c20;
            border: 1px solid #da373c60;
            border-radius: 40px;
            padding: 8px 20px;
            color: #f6a8ab;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .hidden {
            display: none !important;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 36px;
            flex-wrap: wrap;
        }
        .footer-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 28px;
            border-radius: 60px;
            color: #d1d7e0;
            font-weight: 500;
            font-size: 1rem;
            text-decoration: none;
            transition: 0.25s;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            letter-spacing: 0.2px;
        }
        .footer-btn i {
            font-size: 1.3rem;
        }
        .footer-btn.github:hover {
            background: #2b3137;
            border-color: #8b949e;
            color: white;
            transform: translateY(-2px);
        }
        .footer-btn.discord:hover {
            background: #404eed;
            border-color: #7983f5;
            color: white;
            transform: translateY(-2px);
        }
        @media (max-width: 550px) {
            .glass-card { padding: 28px 18px; }
            .title { font-size: 1.5rem; }
            .input-row { flex-direction: column; }
            .search-wrapper { width: 100%; }
            .btn-primary { width: 100%; justify-content: center; }
            .footer-links { flex-direction: column; align-items: center; }
            .footer-btn { width: 100%; justify-content: center; }
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Список результатов поиска (выпадающий) */
        .search-results-list {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 220px;
            overflow-y: auto;
            background: #1e1f22;
            border-radius: 16px;
            border: 1px solid #40444b;
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            z-index: 1000;
        }
        .search-results-list li {
            padding: 8px 16px;
            cursor: pointer;
            color: #d1d7e0;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: 0.1s;
        }
        .search-results-list li:last-child {
            border-bottom: none;
        }
        .search-results-list li:hover {
            background: #2f3136;
            color: #ffffff;
        }
        .search-results-list li .match-appid {
            color: #6c8cff;
            font-size: 0.7rem;
            margin-left: 6px;
        }
        .search-results-list::-webkit-scrollbar {
            width: 4px;
        }
        .search-results-list::-webkit-scrollbar-thumb {
            background: #40444b;
            border-radius: 10px;
        }
        .search-results-list::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>
<body>
<div class="glass-card">
    <div class="title">
        <span>Генератор «Manifest»</span>
    </div>
    <div class="sub-head">
        для SteamLuaTools
    </div>

    <div class="input-group">
        <label for="gameId"><i class="fas fa-hashtag"></i> Введите AppID или название игры</label>
        <div class="input-row">
            <div class="search-wrapper">
                <input type="text" id="gameId" placeholder="Например, Team Fortress 2, 945360" autocomplete="off" />
                <ul class="search-results-list" id="searchResults"></ul>
            </div>
            <button id="checkBtn" class="btn-primary">
                <i class="fas fa-magnifying-glass"></i> Скачать
            </button>
        </div>
    </div>

    <div id="resultsSection" class="hidden">
        <div class="terminal" id="terminalOutput"></div>
        <div class="action-row">
            <div id="notFoundSection" class="hidden">
                <span class="notfound-badge"><i class="fas fa-circle-exclamation"></i> Манифест не найден</span>
            </div>
        </div>
    </div>

    <div class="footer-links">
        <a href="https://github.com/rodekplay" target="_blank" class="footer-btn github">
            <i class="fab fa-github"></i> GitHub
        </a>
        <a href="https://rodekplay.github.io/cs-news.github.io/" target="_blank" class="footer-btn discord">
            <i class="fab fa-discord"></i> Discord сервер
        </a>
    </div>
</div>

<script>
    (function() {
        "use strict";

        const gameIdInput = document.getElementById('gameId');
        const checkBtn = document.getElementById('checkBtn');
        const resultsSection = document.getElementById('resultsSection');
        const terminalOutput = document.getElementById('terminalOutput');
        const notFoundSection = document.getElementById('notFoundSection');
        const searchResults = document.getElementById('searchResults');

        let allGames = [];
        let searchTimeout = null;

        async function loadGames() {
            try {
                const resp = await fetch('steamname.json');
                const data = await resp.json();
                if (data && data.applist && Array.isArray(data.applist.apps)) {
                    allGames = data.applist.apps.map(app => ({
                        appid: String(app.appid),
                        name: app.name || 'Unknown'
                    }));
                    allGames.sort((a, b) => a.name.localeCompare(b.name));
                } else {
                    console.warn('Неверный формат steamname.json');
                    fallbackGames();
                }
            } catch (e) {
                console.warn('Не удалось загрузить steamname.json, используем fallback');
                fallbackGames();
            }
        }

        function fallbackGames() {
            allGames = [
                { appid: '440', name: 'Team Fortress 2' },
                { appid: '730', name: 'Counter-Strike: Global Offensive' },
                { appid: '570', name: 'Dota 2' },
                { appid: '10', name: 'Counter-Strike' },
                { appid: '220', name: 'Half-Life 2' },
                { appid: '70', name: 'Half-Life' },
                { appid: '240', name: 'Counter-Strike: Source' },
                { appid: '550', name: 'Left 4 Dead 2' },
            ];
            allGames.sort((a, b) => a.name.localeCompare(b.name));
        }

        function searchGames(query) {
            const q = query.trim().toLowerCase();
            if (!q) {
                searchResults.style.display = 'none';
                return [];
            }

            if (/^\d+$/.test(q)) {
                const found = allGames.filter(g => g.appid.includes(q));
                return found.slice(0, 20);
            }

            const words = q.split(/\s+/).filter(w => w.length > 0);

            let matches = [];
            for (const game of allGames) {
                const nameLower = game.name.toLowerCase();
                if (nameLower.startsWith(q)) {
                    matches.push(game);
                }
            }

            if (matches.length < 8 && words.length > 0) {
                const extra = [];
                for (const game of allGames) {
                    const nameLower = game.name.toLowerCase();
                    if (matches.some(m => m.appid === game.appid)) continue;
                    const allWordsMatch = words.every(w => nameLower.includes(w));
                    if (allWordsMatch) {
                        extra.push(game);
                    }
                    if (extra.length >= 12) break;
                }
                matches = matches.concat(extra);
            }

            if (matches.length < 6 && words.length > 1) {
                const extra = [];
                for (const game of allGames) {
                    if (matches.some(m => m.appid === game.appid)) continue;
                    const nameLower = game.name.toLowerCase();
                    const anyWord = words.some(w => nameLower.includes(w));
                    if (anyWord) {
                        extra.push(game);
                    }
                    if (extra.length >= 10) break;
                }
                matches = matches.concat(extra);
            }

            return matches.slice(0, 20);
        }

        function showSearchResults(results) {
            searchResults.innerHTML = '';
            if (!results || results.length === 0) {
                searchResults.style.display = 'none';
                return;
            }
            results.forEach(game => {
                const li = document.createElement('li');
                li.innerHTML = `${game.name} <span class="match-appid">${game.appid}</span>`;
                li.addEventListener('click', () => {
                    gameIdInput.value = game.appid;
                    searchResults.style.display = 'none';
                    checkBtn.click();
                });
                searchResults.appendChild(li);
            });
            searchResults.style.display = 'block';
        }

        gameIdInput.addEventListener('input', function() {
            const val = this.value.trim();

            if (/^\d+$/.test(val)) {
                searchResults.style.display = 'none';
                return;
            }

            if (searchTimeout) clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                if (!val) {
                    searchResults.style.display = 'none';
                    return;
                }
                const results = searchGames(val);
                showSearchResults(results);
            }, 150);
        });

        gameIdInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const items = searchResults.querySelectorAll('li');
                if (items.length > 0) {
                    const first = items[0];
                    const text = first.textContent;
                    const match = text.match(/\d+$/);
                    if (match) {
                        gameIdInput.value = match[0];
                        searchResults.style.display = 'none';
                        checkBtn.click();
                        return;
                    }
                }
                checkBtn.click();
            }
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-wrapper')) {
                searchResults.style.display = 'none';
            }
        });

        resultsSection.classList.add('hidden');

        function resetUI() {
            notFoundSection.classList.add('hidden');
            terminalOutput.textContent = '';
            checkBtn.disabled = false;
            checkBtn.innerHTML = '<i class="fas fa-magnifying-glass"></i> Скачать';
        }

        function typeText(text, callback) {
            let index = 0;
            terminalOutput.textContent = '';
            function tick() {
                if (index < text.length) {
                    terminalOutput.textContent += text.charAt(index);
                    index++;
                    setTimeout(tick, 18);
                } else {
                    if (callback) callback();
                }
            }
            tick();
        }

        function triggerDownload(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename || 'manifest.zip';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        async function checkManifest() {
            const gameId = gameIdInput.value.trim();

            if (!gameId || !/^\d+$/.test(gameId)) {
                resultsSection.classList.remove('hidden');
                notFoundSection.classList.add('hidden');
                typeText('⚠️ Ошибка: введите корректный Steam AppID (только цифры).');
                return;
            }

            checkBtn.disabled = true;
            checkBtn.innerHTML = '<span class="spinner"></span> Поиск...';

            resultsSection.classList.remove('hidden');
            notFoundSection.classList.add('hidden');

            const startMsg = `🔍 Проверка манифеста для AppID: ${gameId}\n📡 Запрос к базе...\n`;
            await new Promise((resolve) => {
                typeText(startMsg, resolve);
            });

            try {
                const response = await fetch(`https://api.github.com/repos/SPIN0ZAi/SB_manifest_DB/branches/${gameId}`, {
                    headers: { 'Accept': 'application/vnd.github.v3+json' }
                });

                if (response.status === 200) {
                    const foundMsg = `✅ Манифест найден!\n📦 Подготовка ссылки...\n`;
                    await new Promise((resolve) => {
                        typeText(foundMsg, resolve);
                    });

                    const zipUrl = `https://codeload.github.com/SPIN0ZAi/SB_manifest_DB/zip/refs/heads/${gameId}`;
                    terminalOutput.textContent += `✔ Готово.`;
                    triggerDownload(zipUrl);

                } else {
                    const notFoundMsg = `❌ Манифест для AppID ${gameId} не найден в базе.\nПопробуйте другой ID.`;
                    await new Promise((resolve) => {
                        typeText(notFoundMsg, resolve);
                    });
                    notFoundSection.classList.remove('hidden');
                }
            } catch (err) {
                const errorMsg = `⚠️ Ошибка соединения. Проверьте интернет и повторите.\n${err.message || ''}`;
                await new Promise((resolve) => {
                    typeText(errorMsg, resolve);
                });
                notFoundSection.classList.add('hidden');
            } finally {
                checkBtn.disabled = false;
                checkBtn.innerHTML = '<i class="fas fa-magnifying-glass"></i> Скачать';
            }
        }

        checkBtn.addEventListener('click', function(e) {
            e.preventDefault();
            resetUI();
            checkManifest();
        });

        loadGames();

        console.log('Генератор Manifest для SteamLuaTools');
    })();
</script>
</body>
</html>
